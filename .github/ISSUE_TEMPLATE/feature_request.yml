name: Feature request
description: Something the CLI should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task, not the flag you have in mind for it.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: How you do it today
      description: The API call, console step or script this would replace.
