name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Repeated pushes to the same ref cancel the older run rather than burning
# private-repo minutes on a result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      # A macOS-only flake must not hide the Ubuntu result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Its own step, though golangci-lint runs govet too: a separate step
      # names the failure.
      - run: go vet ./...

      # Lint results do not vary by OS, and macOS minutes bill at ten times
      # the Ubuntu rate on a private repo. Pinned to the version developers
      # run locally, so a clean local lint means a clean CI lint.
      - name: golangci-lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      # Race is clean today and costs about seven seconds on the slowest
      # package, which is cheap insurance for the poller and the retry loop.
      - run: go test -race ./...

  # Packaging, on every PR rather than only at tag time: a snapshot release
  # proves goreleaser still builds all six targets and renders the Homebrew
  # formula, then the npm launcher is installed from the tarballs it produces
  # and run. A broken formula template or npm shim fails here, not on the tag.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --snapshot --clean

      - name: Homebrew formula renders and parses
        run: ruby -c dist/homebrew/Formula/intuizi.rb

      - run: node npm/build.mjs --dist dist --out dist/npm

      - name: npm launcher installs from the tarballs and runs the binary
        run: |
          set -euo pipefail
          for dir in dist/npm/@intuizi/*; do (cd "$dir" && npm pack --silent); done

          prefix="$RUNNER_TEMP/npm-prefix"
          npm install -g --prefix "$prefix" \
            dist/npm/@intuizi/cli-linux-x64/*.tgz dist/npm/@intuizi/cli/*.tgz

          want=$(dist/intuizi_linux_amd64_v1/intuizi version)
          got=$("$prefix/bin/intuizi" version)
          echo "binary reports $want, via npm $got"
          test "$got" = "$want"

          # The launcher must pass exit codes through: 2 is the usage contract.
          set +e
          "$prefix/bin/intuizi" no-such-command
          code=$?
          set -e
          test "$code" -eq 2

  # One stable check name for branch protection: this is the check to make
  # required, not either matrix leg, because it survives a matrix change.
  #
  # !cancelled() rather than always(): always() runs even on a cancelled run,
  # so a push superseded by cancel-in-progress above would fail here and paint
  # a red X on a commit whose only fault was being overtaken.
  ci:
    needs: [test, package]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.package.result }}" = "success"
