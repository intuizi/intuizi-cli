name: npm-smoke

# Manual check that `npm install -g @intuizi/cli` works on a clean machine,
# Windows included. It reads the published registry, so it can only pass for a
# version already on npm. Run it after each release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version the installed binary must report, e.g. 0.1.3 (blank: only check it runs)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # bash everywhere: Windows defaults to pwsh, where the checks below are not
    # valid syntax. Git Bash ships on the Windows image.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The launcher pulls its platform package as an optional dependency, so
      # this is what proves the win32 package resolves and unpacks.
      - run: npm install -g @intuizi/cli

      - run: intuizi version

      - if: inputs.version != ''
        env:
          WANT: ${{ inputs.version }}
        run: test "$(intuizi version)" = "v${WANT#v}"

      # The launcher must pass exit codes through: 2 is the usage contract.
      # Untested on Windows until now, where spawnSync reports differently.
      - name: Unknown command exits 2 through the launcher
        run: |
          set +e
          intuizi no-such-command
          code=$?
          set -e
          test "$code" -eq 2
