name: release

# Only tags publish. A tag is the single trigger, so nothing here can fire on
# an ordinary push and surprise anyone with a release.
on:
  push:
    tags: ["v*"]

# Nothing is granted by default; each job asks for exactly what it needs. A
# top-level write would hand the same power to the test job, which only reads.
permissions:
  contents: read

jobs:
  # Tests gate the release. A tag that fails here publishes nothing, which is
  # the whole reason this is a separate job rather than a goreleaser hook.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...

      - run: go test -race ./...

  # GitHub Release plus the Homebrew formula. goreleaser cross-compiles six
  # binaries, packages them with a checksums file, creates the release, then
  # commits the formula to intuizi/homebrew-intuizi-cli over SSH using the
  # deploy key in HOMEBREW_TAP_DEPLOY_KEY, which can write to that one repo
  # and nothing else. A prerelease tag (v0.2.0-rc1) still gets a GitHub
  # Release, but skip_upload: auto in .goreleaser.yaml leaves the formula alone.
  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # goreleaser creates the Release and uploads the archives.
      contents: write
      # Both are for the build attestation: the runner mints an OIDC token and
      # GitHub records what produced each archive, so anyone can verify a
      # download came from this workflow with `gh attestation verify`.
      id-token: write
      attestations: write
    steps:
      # fetch-depth 0 because goreleaser reads the tag history to work out the
      # version and to build the changelog from commits since the last tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Issued automatically to the run; no secret to create or rotate.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      # The npm job builds from these rather than compiling again, so the
      # binaries on npm are byte for byte the ones in the GitHub Release.
      # Signed provenance for every published archive, tying it to this commit,
      # this workflow and this runner.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/artifacts.json
            dist/metadata.json
            dist/intuizi_*/intuizi
            dist/intuizi_*/intuizi.exe
          retention-days: 7
          if-no-files-found: error

  # Its own job so a registry failure can be re-run on its own: by then the
  # GitHub Release and the formula are already out and must not be redone.
  # Publishing is skipped, not failed, while the NPM_TOKEN secret is missing,
  # so the GitHub Release and Homebrew keep working before npm is set up.
  npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token: write is for provenance, which ties each published tarball to
    # this commit and this run.
    #
    # It is also what trusted publishing would use, and every package here is
    # already registered to trust this workflow file. That path does not work
    # yet: repositories created after 15 July 2026 mint OIDC tokens with
    # GitHub's immutable subject claim, which the npm registry cannot validate,
    # so the exchange is refused with "package not found" (npm/cli#9969). This
    # repository was created on 20 July 2026 and the claim cannot be turned
    # off. Until npm fixes it, publishing uses the NPM_TOKEN secret. Delete the
    # token, the secret and this paragraph once the exchange succeeds.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # registry-url writes the .npmrc line that reads NODE_AUTH_TOKEN. When
      # trusted publishing starts working, this option and the token below both
      # come out: an empty NODE_AUTH_TOKEN still counts as configured
      # authentication and silently suppresses the OIDC exchange.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Newer than Node 22 ships, for the publishing behaviour this job relies on.
      - run: npm install -g npm@^11

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - run: node npm/build.mjs --dist dist --out dist/npm

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./dist/npm/@intuizi/cli/package.json').version")

          # Nothing below 0.1.0 reaches the registry. The 0.0.x tags exist to
          # exercise this pipeline while both repositories are private, and a
          # package published from one would carry a README whose every link
          # 404s, on a version number npm will never let us reuse. v0.1.0 is
          # the first public release, so this guard falls away on its own.
          case "$version" in
            0.0.*)
              echo "::warning::$version is below 0.1.0, so the npm packages were built but not published"
              exit 0
              ;;
          esac

          # A prerelease must not become what a plain `npm install` resolves to.
          tag=latest
          case "$version" in *-*) tag=next ;; esac

          # Idempotent so a re-run after a partial publish finishes the set
          # instead of failing on the packages that already went out.
          publish() {
            local dir=$1 name
            name=$(node -p "require('./$dir/package.json').name")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is already on the registry"
              return
            fi
            (cd "$dir" && npm publish --access public --tag "$tag" --provenance)
          }

          # Platform packages first, so the launcher's optionalDependencies
          # resolve the moment @intuizi/cli itself appears on the registry.
          for dir in dist/npm/@intuizi/cli-*; do publish "$dir"; done
          publish dist/npm/@intuizi/cli
