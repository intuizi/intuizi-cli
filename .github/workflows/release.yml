name: release

# Only tags publish. A tag is the single trigger, so nothing here can fire on
# an ordinary push and surprise anyone with a release.
on:
  push:
    tags: ["v*"]

# Read is not enough: goreleaser creates the GitHub Release and uploads the
# archives, both of which are writes to repository contents.
permissions:
  contents: write

jobs:
  # Tests gate the release. A tag that fails here publishes nothing, which is
  # the whole reason this is a separate job rather than a goreleaser hook.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...

      - run: go test -race ./...

  # GitHub Release plus the Homebrew formula. goreleaser cross-compiles six
  # binaries, packages them with a checksums file, creates the release, then
  # commits the formula to intuizi/homebrew-intuizi-cli over SSH using the
  # deploy key in HOMEBREW_TAP_DEPLOY_KEY, which can write to that one repo
  # and nothing else. A prerelease tag (v0.2.0-rc1) still gets a GitHub
  # Release, but skip_upload: auto in .goreleaser.yaml leaves the formula alone.
  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth 0 because goreleaser reads the tag history to work out the
      # version and to build the changelog from commits since the last tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Issued automatically to the run; no secret to create or rotate.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      # The npm job builds from these rather than compiling again, so the
      # binaries on npm are byte for byte the ones in the GitHub Release.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/artifacts.json
            dist/metadata.json
            dist/intuizi_*/intuizi
            dist/intuizi_*/intuizi.exe
          retention-days: 7
          if-no-files-found: error

  # Its own job so a registry failure can be re-run on its own: by then the
  # GitHub Release and the formula are already out and must not be redone.
  # Publishing is skipped, not failed, while the NPM_TOKEN secret is missing,
  # so the GitHub Release and Homebrew keep working before npm is set up.
  npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No npm credential lives here. Each package names this workflow file as
    # its trusted publisher, so npm accepts a short-lived OIDC token minted for
    # this run and nothing else: a leaked secret cannot publish, and there is
    # no token to rotate. id-token: write is what lets the runner mint it.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10, which predates trusted publishing.
      - run: npm install -g npm@^11

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - run: node npm/build.mjs --dist dist --out dist/npm

      - name: Publish to npm
        run: |
          set -euo pipefail
          version=$(node -p "require('./dist/npm/@intuizi/cli/package.json').version")

          # Nothing below 0.1.0 reaches the registry. The 0.0.x tags exist to
          # exercise this pipeline while both repositories are private, and a
          # package published from one would carry a README whose every link
          # 404s, on a version number npm will never let us reuse. v0.1.0 is
          # the first public release, so this guard falls away on its own.
          case "$version" in
            0.0.*)
              echo "::warning::$version is below 0.1.0, so the npm packages were built but not published"
              exit 0
              ;;
          esac

          # A prerelease must not become what a plain `npm install` resolves to.
          tag=latest
          case "$version" in *-*) tag=next ;; esac

          # Idempotent so a re-run after a partial publish finishes the set
          # instead of failing on the packages that already went out.
          publish() {
            local dir=$1 name
            name=$(node -p "require('./$dir/package.json').name")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is already on the registry"
              return
            fi
            (cd "$dir" && npm publish --access public --tag "$tag" --provenance)
          }

          # Platform packages first, so the launcher's optionalDependencies
          # resolve the moment @intuizi/cli itself appears on the registry.
          for dir in dist/npm/@intuizi/cli-*; do publish "$dir"; done
          publish dist/npm/@intuizi/cli
