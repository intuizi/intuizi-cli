name: oidc-probe

# Temporary diagnostic. It attempts to publish a version that already exists on
# the registry, so nothing can be created: an authenticated attempt is refused
# as a duplicate, an unauthenticated one is refused as unauthenticated, and the
# difference is the answer. Delete once trusted publishing is proven.
on:
  workflow_dispatch:
  push:
    branches: [harden-supply-chain]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: npm install -g npm@^11

      - name: Attempt a publish that cannot succeed
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/probe && cd /tmp/probe
          cat > package.json <<'JSON'
          { "name": "@intuizi/cli", "version": "0.1.0", "description": "probe", "license": "SEE LICENSE IN LICENSE" }
          JSON
          echo "npm $(npm --version), id-token url: ${ACTIONS_ID_TOKEN_REQUEST_URL:+present}"
          npm publish --access public --loglevel verbose > out.txt 2>&1
          echo "exit: $?"
          echo "----- what npm did about authentication -----"
          grep -aiE "oidc|id.?token|exchange|auth|401|403|404|409|E[A-Z]+" out.txt | sed 's/[A-Za-z0-9_.-]\{40,\}/<redacted>/g' | head -25
